<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>IP & Port Monitoring System</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #1e293b;
        }

        .header {
            background: #1e293b;
            color: white;
            padding: 22px 40px;
        }

        .header h1 {
            margin: 0;
            font-size: 26px;
        }

        .header p {
            margin: 6px 0 0;
            color: #cbd5e1;
        }

        .container {
            max-width: 1200px;
            margin: 30px auto;
            padding: 0 20px;
        }

        /* Statistics */

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .card h3 {
            margin: 0;
            font-size: 15px;
            color: #64748b;
        }

        .card p {
            margin: 10px 0 0;
            font-size: 27px;
            font-weight: bold;
        }

        /* Add Target */

        .add-box {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;
        }

        .add-box h2 {
            margin-top: 0;
        }

        input {
            padding: 11px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            margin-right: 8px;
            width: 220px;
        }

        button {
            padding: 11px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            font-weight: bold;
        }

        .add-btn {
            background: #2563eb;
        }

        .add-btn:hover {
            background: #1d4ed8;
        }

        /* Monitoring */

        .monitor-box {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            margin-bottom: 25px;

            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .monitor-info h2 {
            margin: 0 0 5px 0;
        }

        .monitor-info p {
            margin: 0;
            color: #64748b;
        }

        .monitor-btn {
            min-width: 180px;
            font-size: 15px;
        }

        .monitor-on {
            background: #16a34a;
        }

        .monitor-off {
            background: #dc2626;
        }

        /* Table */

        .table-box {
            background: white;
            padding: 22px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            overflow-x: auto;
        }

        .table-box h2 {
            margin-top: 0;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }

        th {
            background: #f8fafc;
            color: #475569;
        }

        th,
        td {
            padding: 13px;
            border-bottom: 1px solid #e2e8f0;
            text-align: center;
            white-space: nowrap;
        }

        /* Status */

        .open {
            color: green;
            font-weight: bold;
        }

        .closed {
            color: red;
            font-weight: bold;
        }

        /* Buttons */

        .check-btn {
            background: #475569;
            padding: 8px 14px;
            margin-right: 5px;
        }

        .delete-btn {
            background: #dc2626;
            padding: 8px 14px;
        }

        /* Mobile */

        @media (max-width: 800px) {

            .cards {
                grid-template-columns: 1fr;
            }

        }

        @media (max-width: 600px) {

            input {
                width: 100%;
                margin-bottom: 10px;
            }

            .add-btn {
                width: 100%;
            }

            .monitor-box {
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }

            .monitor-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


<!-- HEADER -->

<div class="header">

    <h1>🌐 IP & Port Monitoring System</h1>

    <p>Cloud-Based Network Monitoring Dashboard</p>

</div>


<div class="container">


    <!-- STATISTICS -->

    <div class="cards">

        <div class="card">

            <h3>Total Targets</h3>

            <p id="totalTargets">0</p>

        </div>


        <div class="card">

            <h3>Open Ports</h3>

            <p id="openTargets">0</p>

        </div>


        <div class="card">

            <h3>Closed Ports</h3>

            <p id="closedTargets">0</p>

        </div>

    </div>


    <!-- ADD TARGET -->

    <div class="add-box">

        <h2>Add Target</h2>

        <input
            id="ip"
            type="text"
            placeholder="IP or Hostname"
        >

        <input
            id="port"
            type="number"
            placeholder="Port"
        >

        <button
            class="add-btn"
            onclick="addTarget()"
        >
            Add Target
        </button>

    </div>


    <!-- AUTOMATIC MONITORING -->

    <div class="monitor-box">

        <div class="monitor-info">

            <h2>Automatic Monitoring</h2>

            <p id="monitorText">
                Automatic monitoring is OFF
            </p>

        </div>


        <button
            id="monitorButton"
            class="monitor-btn monitor-off"
            onclick="toggleMonitoring()"
        >
            🔴 Turn ON
        </button>

    </div>


    <!-- TARGET TABLE -->

    <div class="table-box">

        <h2>Monitored Targets</h2>


        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>IP / Hostname</th>

                    <th>Port</th>

                    <th>Status</th>

                    <th>Response Time</th>

                    <th>Last Checked</th>

                    <th>Action</th>

                </tr>

            </thead>


            <tbody id="targetTable">

            </tbody>

        </table>

    </div>


</div>


<script>


// ===================================
// Monitoring Variables
// ===================================

let monitoringEnabled = false;

let monitoringInterval = null;


// ===================================
// Add Target
// ===================================

async function addTarget() {

    const ip =
        document.getElementById("ip").value.trim();

    const port =
        document.getElementById("port").value;


    if (ip === "" || port === "") {

        alert("Please enter IP and Port");

        return;

    }


    try {

        const response = await fetch(
            "/targets?ip=" +
            encodeURIComponent(ip) +
            "&port=" +
            port,
            {
                method: "POST"
            }
        );


        if (!response.ok) {

            alert("Failed to add target");

            return;

        }


        document.getElementById("ip").value = "";

        document.getElementById("port").value = "";


        loadTargets();

    }

    catch (error) {

        alert("Server connection error");

    }

}


// ===================================
// Load Targets
// ===================================

async function loadTargets() {

    try {

        const response =
            await fetch("/targets");


        const targets =
            await response.json();


        const table =
            document.getElementById("targetTable");


        table.innerHTML = "";


        document.getElementById("totalTargets").innerText =
            targets.length;


        document.getElementById("openTargets").innerText =
            "0";


        document.getElementById("closedTargets").innerText =
            "0";


        targets.forEach(function(target) {

            const row =
                document.createElement("tr");


            row.innerHTML = `

                <td>
                    ${target.id}
                </td>

                <td>
                    ${target.ip}
                </td>

                <td>
                    ${target.port}
                </td>

                <td id="status-${target.id}">
                    Not Checked
                </td>

                <td id="time-${target.id}">
                    -
                </td>

                <td id="checked-${target.id}">
                    -
                </td>

                <td>

                    <button
                        class="check-btn"
                        onclick="checkTarget(
                            '${target.ip}',
                            ${target.port},
                            ${target.id}
                        )"
                    >
                        Check
                    </button>


                    <button
                        class="delete-btn"
                        onclick="deleteTarget(
                            ${target.id}
                        )"
                    >
                        Delete
                    </button>

                </td>

            `;


            table.appendChild(row);

        });

    }

    catch (error) {

        console.log(
            "Could not load targets"
        );

    }

}


// ===================================
// Manual Check
// ===================================

async function checkTarget(ip, port, id) {

    try {

        const response =
            await fetch(
                "/check?ip=" +
                encodeURIComponent(ip) +
                "&port=" +
                port
            );


        const result =
            await response.json();


        updateRow(
            result,
            id
        );

        updateStatistics();

    }

    catch (error) {

        console.log(
            "Could not check target"
        );

    }

}


// ===================================
// Update Row
// ===================================

function updateRow(result, id) {

    const status =
        document.getElementById(
            "status-" + id
        );


    const time =
        document.getElementById(
            "time-" + id
        );


    const checked =
        document.getElementById(
            "checked-" + id
        );


    if (!status) {

        return;

    }


    if (result.status === "OPEN") {

        status.innerHTML =
            "🟢 OPEN";

        status.className =
            "open";

    }

    else {

        status.innerHTML =
            "🔴 CLOSED";

        status.className =
            "closed";

    }


    time.innerHTML =
        result.response_time + " ms";


    checked.innerHTML =
        result.checked_at;

}


// ===================================
// Update Statistics
// ===================================

async function updateStatistics() {

    try {

        const response =
            await fetch("/targets");


        const targets =
            await response.json();


        let openCount = 0;

        let closedCount = 0;


        for (const target of targets) {

            const status =
                document.getElementById(
                    "status-" + target.id
                );


            if (status) {

                if (
                    status.innerText.includes("OPEN")
                ) {

                    openCount++;

                }

                else if (
                    status.innerText.includes("CLOSED")
                ) {

                    closedCount++;

                }

            }

        }


        document.getElementById(
            "openTargets"
        ).innerText =
            openCount;


        document.getElementById(
            "closedTargets"
        ).innerText =
            closedCount;

    }

    catch (error) {

        console.log(
            "Could not update statistics"
        );

    }

}


// ===================================
// Automatic Monitoring
// ===================================

async function automaticMonitoring() {

    if (!monitoringEnabled) {

        return;

    }


    try {

        const response =
            await fetch("/targets");


        const targets =
            await response.json();


        for (const target of targets) {

            try {

                const response =
                    await fetch(
                        "/check?ip=" +
                        encodeURIComponent(target.ip) +
                        "&port=" +
                        target.port
                    );


                const result =
                    await response.json();


                updateRow(
                    result,
                    target.id
                );

            }

            catch (error) {

                console.log(
                    "Could not check target"
                );

            }

        }


        updateStatistics();

    }

    catch (error) {

        console.log(
            "Automatic monitoring error"
        );

    }

}


// ===================================
// Monitoring ON / OFF
// ===================================

function toggleMonitoring() {

    const button =
        document.getElementById(
            "monitorButton"
        );


    const text =
        document.getElementById(
            "monitorText"
        );


    if (!monitoringEnabled) {

        monitoringEnabled = true;


        button.innerHTML =
            "🟢 Turn OFF";


        button.className =
            "monitor-btn monitor-on";


        text.innerHTML =
            "Automatic monitoring is ON — checking every 10 seconds";


        automaticMonitoring();


        monitoringInterval =
            setInterval(
                automaticMonitoring,
                10000
            );

    }

    else {

        monitoringEnabled = false;


        button.innerHTML =
            "🔴 Turn ON";


        button.className =
            "monitor-btn monitor-off";


        text.innerHTML =
            "Automatic monitoring is OFF";


        clearInterval(
            monitoringInterval
        );


        monitoringInterval = null;

    }

}


// ===================================
// Delete Target
// ===================================

async function deleteTarget(id) {

    const confirmDelete =
        confirm(
            "Are you sure you want to delete this target?"
        );


    if (!confirmDelete) {

        return;

    }


    try {

        const response =
            await fetch(
                "/targets/" + id,
                {
                    method: "DELETE"
                }
            );


        if (response.ok) {

            loadTargets();

        }

        else {

            alert(
                "Failed to delete target"
            );

        }

    }

    catch (error) {

        alert(
            "Server connection error"
        );

    }

}


// ===================================
// Initial Page Load
// ===================================

window.onload = function() {

    loadTargets();

};


</script>


</body>

</html>
